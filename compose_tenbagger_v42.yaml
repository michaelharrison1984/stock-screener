        @app.route("/api/screen")
        def api_screen():

            region_key = request.args.get(
                "region",
                "global"
            ).lower()

            sector = request.args.get(
                "sector",
                ""
            ).strip()

            preset_key = request.args.get(
                "preset",
                "opportunity"
            ).lower()

            preset = PRESETS.get(
                preset_key,
                PRESETS["opportunity"]
            )

            try:
                min_cap = float(
                    request.args.get(
                        "min_cap",
                        preset["min_cap"]
                    )
                )
            except Exception:
                min_cap = preset["min_cap"]

            try:
                max_cap = float(
                    request.args.get(
                        "max_cap",
                        preset["max_cap"]
                    )
                )
            except Exception:
                max_cap = preset["max_cap"]

            try:
                min_score = float(
                    request.args.get(
                        "min_score",
                        preset["min_score"]
                    )
                )
            except Exception:
                min_score = preset["min_score"]

            if sector not in SECTORS:
                sector = None

            regions = REGIONS.get(
                region_key,
                REGIONS["global"]
            )

            cache_key = (
                region_key,
                sector,
                preset_key,
                min_cap,
                max_cap,
                min_score
            )

            now = time.time()

            with cache_lock:
                cached = cache.get(
                    cache_key
                )

                if (
                    cached
                    and now - cached["time"]
                    < CACHE_SECONDS
                ):
                    return jsonify(
                        cached["data"]
                    )

            print(
                "Starting screen:",
                region_key,
                sector,
                preset_key,
                min_cap,
                max_cap,
                min_score
            )

            candidates = discover_candidates(
                regions,
                sector,
                min_cap,
                max_cap,
                preset_key
            )

            print(
                "Candidates selected for enrichment:",
                len(candidates)
            )

            enriched = []

            with ThreadPoolExecutor(
                max_workers=6
            ) as executor:

                futures = [
                    executor.submit(
                        enrich_candidate,
                        candidate,
                        preset_key
                    )
                    for candidate in candidates
                ]

                for future in as_completed(
                    futures
                ):
                    try:
                        result = future.result()

                        if (
                            result
                            and not result.get(
                                "rejected",
                                True
                            )
                        ):
                            enriched.append(
                                result
                            )

                    except Exception as exc:
                        print(
                            "Future failed:",
                            exc
                        )

            results = []

            for stock in enriched:

                cap = stock.get(
                    "market_cap_gbp_m"
                )

                if cap is not None:

                    if (
                        min_cap
                        and cap < min_cap
                    ):
                        continue

                    if (
                        max_cap
                        and max_cap > 0
                        and cap > max_cap
                    ):
                        continue

                if preset_key == "tenbagger":
                    overall = stock.get("tenbagger_score")
                else:
                    overall = weighted_score([
                    (
                        stock.get("quality"),
                        preset[
                            "quality_weight"
                        ]
                    ),
                    (
                        stock.get("value"),
                        preset[
                            "value_weight"
                        ]
                    ),
                    (
                        stock.get("growth"),
                        preset[
                            "growth_weight"
                        ]
                    )
                ])

                if overall is None:
                    continue

                overall = round(
                    overall,
                    1
                )

                if overall < min_score:
                    continue

                stock["overall"] = overall

                stock["quality"] = (
                    round(
                        stock["quality"],
                        1
                    )
                    if stock["quality"]
                    is not None
                    else None
                )

                stock["value"] = (
                    round(
                        stock["value"],
                        1
                    )
                    if stock["value"]
                    is not None
                    else None
                )

                stock["growth"] = (
                    round(
                        stock["growth"],
                        1
                    )
                    if stock["growth"]
                    is not None
                    else None
                )

                results.append(stock)

            results.sort(
                key=lambda x: (
                    x.get("overall", 0),
                    x.get(
                        "data_completeness",
                        0
                    )
                ),
                reverse=True
            )

            results = results[:75]

            payload = {
                "results": results,

                "count": len(results),

                "candidates_scanned": (
                    len(candidates)
                ),

                "preset": {
                    "key": preset_key,
                    "name": preset["name"],
                    "quality_weight": (
                        preset[
                            "quality_weight"
                        ]
                    ),
                    "value_weight": (
                        preset[
                            "value_weight"
                        ]
                    ),
                    "growth_weight": (
                        preset[
                            "growth_weight"
                        ]
                    )
                },

                "region": region_key,

                "regions_scanned": regions,

                "market_cap_currency": "GBP",

                "generated": int(time.time())
            }

            with cache_lock:
                cache[cache_key] = {
                    "time": now,
                    "data": payload
                }

            return jsonify(payload)


        @app.route("/health")
        def health():
            return jsonify({
                "status": "ok",
                "version": "4.2-tenbagger-discovery",
                "service": "Global Opportunity Stock Screener"
            })


