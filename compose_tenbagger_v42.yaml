          <div class="subtitle">
            Quality × Value × Growth · Global discovery · Market caps shown in GBP
          </div>

          <div class="panel">

            <div class="preset-row">
              <button
                class="preset active"
                data-preset="opportunity">
                Opportunity
              </button>

              <button
                class="preset"
                data-preset="deepvalue">
                Deep Value
              </button>

              <button
                class="preset"
                data-preset="compounder">
                Quality Compounder
              </button>

              <button
                class="preset"
                data-preset="growthvalue">
                Growth at Value
              </button>

              <button
                class="preset"
                data-preset="smallcap">
                🐟 Small Cap Opportunity
              </button>

              <button
                class="preset"
                data-preset="tenbagger">
                🚀 Tenbagger / Lynch
              </button>
            </div>

            <div class="filters">

              <div>
                <label>Region</label>

                <select id="region">
                  <option value="global">🌍 Global</option>
                  <option value="gb">🇬🇧 United Kingdom</option>
                  <option value="us">🇺🇸 United States</option>
                  <option value="ca">🇨🇦 Canada</option>
                  <option value="europe">🇪🇺 Europe</option>
                  <option value="japan">🇯🇵 Japan</option>
                  <option value="korea">🇰🇷 South Korea</option>
                  <option value="australia">🇦🇺 Australia</option>
                  <option value="asia">🌏 Asia-Pacific</option>
                  <option value="emerging">🌱 Emerging Markets</option>
                </select>
              </div>

              <div>
                <label>Sector</label>

                <select id="sector">
                  <option value="">All sectors</option>
                  <option>Basic Materials</option>
                  <option>Communication Services</option>
                  <option>Consumer Cyclical</option>
                  <option>Consumer Defensive</option>
                  <option>Energy</option>
                  <option>Financial Services</option>
                  <option>Healthcare</option>
                  <option>Industrials</option>
                  <option>Real Estate</option>
                  <option>Technology</option>
                  <option>Utilities</option>
                </select>
              </div>

              <div>
                <label>Minimum Market Cap (£m)</label>
                <input id="minCap" type="number" value="500" min="0">
              </div>

              <div>
                <label>Maximum Market Cap (£m)</label>
                <input
                  id="maxCap"
                  type="number"
                  value="0"
                  min="0"
                  placeholder="0 = no maximum">
              </div>

              <div>
                <label>Minimum Overall Score</label>
                <input
                  id="minScore"
                  type="number"
                  value="60"
                  min="0"
                  max="100">
              </div>

              <div>
                <button
                  class="run"
                  onclick="runScreen()">
                  Run Screen
                </button>
              </div>

            </div>

            <div class="lens" id="lens">
              Opportunity · Quality 40% · Value 40% · Growth 20%
            </div>

          </div>

          <div class="panel" id="detail">

            <h2 id="detailTitle"></h2>

            <div
              class="muted"
              id="detailSubtitle">
            </div>

            <div class="detail-grid">

              <div class="detail-card">
                <div class="muted">Overall</div>
                <div
                  class="detail-value"
                  id="dOverall">
                </div>
              </div>

              <div class="detail-card">
                <div class="muted">Quality</div>
                <div
                  class="detail-value"
                  id="dQuality">
                </div>
              </div>

              <div class="detail-card">
                <div class="muted">Value</div>
                <div
                  class="detail-value"
                  id="dValue">
                </div>
              </div>

              <div class="detail-card">
                <div class="muted">Growth</div>
                <div
                  class="detail-value"
                  id="dGrowth">
                </div>
              </div>

            </div>

            <h3>Strengths</h3>
            <ul id="strengths"></ul>

            <h3>Things to investigate</h3>
            <ul id="cautions"></ul>

            <h3>Missing / incomplete data</h3>
            <ul id="missing"></ul>

          </div>

          <div class="status" id="status">
            Ready.
          </div>

          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Company</th>
                  <th>Country</th>
                  <th>Sector</th>
                  <th>Overall</th>
                  <th>Lynch Stage</th>
                  <th>Quality</th>
                  <th>Value</th>
                  <th>Growth</th>
                  <th>P/E</th>
                  <th>FCF Yield</th>
                  <th>ROIC</th>
                  <th>ROE</th>
                  <th>Rev CAGR</th>
                  <th>EPS CAGR</th>
                  <th>Data</th>
                  <th>Market Cap</th>
                  <th>Why?</th>
                  <th>Links</th>
                </tr>
              </thead>

              <tbody id="results"></tbody>

            </table>

          </div>

          <div class="footnote">
            This is a candidate-discovery tool, not an investment recommendation.
            Missing Yahoo data is not automatically scored as zero. Global searches
            balance candidates across countries so the result set is not dominated
            by the United States. Small-cap candidates require additional research
            into liquidity, dilution, customer concentration and balance-sheet risk.
          </div>

          <script>
            var currentPreset = "opportunity";
            var currentResults = [];

            var presets = {
              opportunity: {
                name: "Opportunity",
                q: 40,
                v: 40,
                g: 20,
                minCap: 500,
                maxCap: 0,
                score: 60
              },

              deepvalue: {
                name: "Deep Value",
                q: 25,
                v: 60,
                g: 15,
                minCap: 300,
                maxCap: 0,
                score: 58
              },

              compounder: {
                name: "Quality Compounder",
                q: 60,
                v: 20,
                g: 20,
                minCap: 750,
                maxCap: 0,
                score: 65
              },

              growthvalue: {
                name: "Growth at Value",
                q: 35,
                v: 25,
                g: 40,
                minCap: 500,
                maxCap: 0,
                score: 60
              },

              smallcap: {
                name: "Small Cap Opportunity",
                q: 45,
                v: 35,
                g: 20,
                minCap: 100,
                maxCap: 1500,
                score: 55
              },

              tenbagger: {
                name: "Tenbagger / Lynch",
                q: 25,
                v: 20,
                g: 55,
                minCap: 150,
                maxCap: 7500,
                score: 45
              }
            };


            document
              .querySelectorAll(".preset")
              .forEach(function(button) {

                button.addEventListener(
                  "click",
                  function() {

                    document
                      .querySelectorAll(".preset")
                      .forEach(function(b) {
                        b.classList.remove(
                          "active"
                        );
                      });

                    button.classList.add(
                      "active"
                    );

                    currentPreset =
                      button.dataset.preset;

                    var p =
                      presets[currentPreset];

                    document
                      .getElementById("minCap")
                      .value = p.minCap;

                    document
                      .getElementById("maxCap")
                      .value = p.maxCap;

                    document
                      .getElementById("minScore")
                      .value = p.score;

                    updateLens();
                  }
                );
              });


            function updateLens() {
              var p = presets[currentPreset];

              document.getElementById(
                "lens"
              ).textContent = currentPreset === "tenbagger"
                ? "Tenbagger / Lynch · Growth + runway led · £150m–£7.5bn · PEG, ROIC, leverage and scaling economics"
                : p.name +
                  " · Quality " +
                  p.q +
                  "% · Value " +
                  p.v +
                  "% · Growth " +
                  p.g +
                  "%";
            }


            function fmt(value, digits) {
              if (
                value === null ||
                value === undefined ||
                isNaN(value)
              ) {
                return "—";
              }

              return Number(value).toFixed(
                digits === undefined ? 1 : digits
              );
            }


            function pct(value) {
              if (
                value === null ||
                value === undefined
              ) {
                return "—";
              }

              return (
                Number(value * 100).toFixed(1)
                + "%"
              );
            }


            function scoreClass(score) {
              if (score >= 85) {
                return "exceptional";
              }

              if (score >= 75) {
                return "strong";
              }

              if (score >= 65) {
                return "interesting";
              }

              return "watch";
            }


            function scoreLabel(score) {
              if (score >= 85) {
                return "Exceptional";
              }

              if (score >= 75) {
                return "Strong";
              }

              if (score >= 65) {
                return "Interesting";
              }

              return "Watchlist";
            }


            function capFormat(value) {
              if (
                value === null ||
                value === undefined
              ) {
                return "—";
              }

              if (value >= 1000) {
                return (
                  "£" +
                  (value / 1000).toFixed(1)
                  + "bn"
                );
              }

              return (
                "£" +
                value.toFixed(0)
                + "m"
              );
            }


            async function runScreen() {

              var status =
                document.getElementById(
                  "status"
                );

              status.textContent =
                "Screening markets and analysing candidates…";

              status.classList.add(
                "loading"
              );

              document.getElementById(
                "results"
              ).innerHTML = "";

              document.getElementById(
                "detail"
              ).style.display = "none";

              var params =
                new URLSearchParams();

              params.set(
                "region",
                document.getElementById(
                  "region"
                ).value
              );

              params.set(
                "sector",
                document.getElementById(
                  "sector"
                ).value
              );

              params.set(
                "preset",
                currentPreset
              );

              params.set(
                "min_cap",
                document.getElementById(
                  "minCap"
                ).value
              );

              params.set(
                "max_cap",
                document.getElementById(
                  "maxCap"
                ).value
              );

              params.set(
                "min_score",
                document.getElementById(
                  "minScore"
                ).value
              );

              try {

                var response = await fetch(
                  "/api/screen?"
                  + params.toString()
                );

                var data =
                  await response.json();

                currentResults =
                  data.results || [];

                renderResults(
                  currentResults
                );

                status.classList.remove(
                  "loading"
                );

                status.textContent =
                  currentResults.length +
                  " results · "
                  + data.candidates_scanned
                  + " candidates analysed · "
                  + data.regions_scanned.length
                  + " market(s) searched.";

              } catch (error) {

                status.classList.remove(
                  "loading"
                );

                status.textContent =
                  "Screen failed: "
                  + error.message;
              }
            }


            function renderResults(results) {

              var body =
                document.getElementById(
                  "results"
                );

              body.innerHTML = "";

              results.forEach(
                function(stock, index) {

                  var row =
                    document.createElement(
                      "tr"
                    );

                  var cls =
                    scoreClass(
                      stock.overall
                    );

                  row.innerHTML =
                    "<td class='ticker'>"
                    + stock.symbol
                    + "</td>"

                    + "<td class='company'>"
                    + stock.company
                    + "</td>"

                    + "<td>"
                    + (stock.country || "—")
                    + "</td>"

                    + "<td>"
                    + stock.sector
                    + "</td>"

                    + "<td class='score "
                    + cls
                    + "'>"
                    + fmt(stock.overall)
                    + "<br><span class='muted'>"
                    + scoreLabel(stock.overall)
                    + "</span></td>"

                    + "<td>"
                    + (currentPreset === "tenbagger" ? (stock.tenbagger_stage || "Watch") : "—")
                    + "</td>"

                    + "<td>"
                    + fmt(stock.quality)
                    + "</td>"

                    + "<td>"
                    + fmt(stock.value)
                    + "</td>"

                    + "<td>"
                    + fmt(stock.growth)
                    + "</td>"

                    + "<td>"
                    + fmt(stock.pe)
                    + "</td>"

                    + "<td>"
                    + pct(stock.fcf_yield)
                    + "</td>"

                    + "<td>"
                    + pct(stock.roic)
                    + "</td>"

                    + "<td>"
                    + pct(stock.roe)
                    + "</td>"

                    + "<td>"
                    + pct(stock.revenue_cagr)
                    + "</td>"

                    + "<td>"
                    + pct(stock.earnings_cagr)
                    + "</td>"

                    + "<td>"
                    + stock.data_completeness
                    + "%</td>"

                    + "<td>"
                    + capFormat(
                      stock.market_cap_gbp_m
                    )
                    + "</td>"

                    + "<td>"
                    + "<button class='why-btn' "
                    + "onclick='showDetail("
                    + index
                    + ")'>Why?</button>"
                    + "</td>"

                    + "<td class='links'>"
                    + "<a target='_blank' href='"
                    + stock.tradingview
                    + "'>TV</a>"
                    + "<a target='_blank' href='"
                    + stock.yahoo
                    + "'>Yahoo</a>"
                    + "</td>";

                  body.appendChild(row);
                }
              );
            }


            function listInto(id, items, fallback) {

              var el =
                document.getElementById(id);

              el.innerHTML = "";

              if (!items || items.length === 0) {

                var li =
                  document.createElement(
                    "li"
                  );

                li.textContent = fallback;

                el.appendChild(li);

                return;
              }

              items.forEach(function(text) {

                var li =
                  document.createElement(
                    "li"
                  );

                li.textContent = text;

                el.appendChild(li);
              });
            }


            function showDetail(index) {

              var stock =
                currentResults[index];

              if (!stock) {
                return;
              }

              document.getElementById(
                "detail"
              ).style.display = "block";

              document.getElementById(
                "detailTitle"
              ).textContent =
                stock.symbol +
                " — " +
                stock.company;

              document.getElementById(
                "detailSubtitle"
              ).textContent =
                (stock.country || "") +
                " · " +
                stock.sector +
                " · " +
                (stock.industry || "") +
                " · Data completeness "
                + stock.data_completeness
                + "%";

              document.getElementById(
                "dOverall"
              ).textContent =
                fmt(stock.overall);

              document.getElementById(
                "dQuality"
              ).textContent =
                fmt(stock.quality);

              document.getElementById(
                "dValue"
              ).textContent =
                fmt(stock.value);

              document.getElementById(
                "dGrowth"
              ).textContent =
                fmt(stock.growth);

              var detailStrengths = (stock.strengths || []).slice();
              if (currentPreset === "tenbagger" && stock.tenbagger_notes) {
                detailStrengths = stock.tenbagger_notes.concat(detailStrengths);
              }

              listInto(
                "strengths",
                detailStrengths,
                "No obvious standout strengths were generated automatically."
              );

              listInto(
                "cautions",
                stock.cautions,
                "No automatic cautions generated — still complete normal research."
              );

              listInto(
                "missing",
                stock.missing,
                "No major scoring fields appear to be missing."
              );

              window.scrollTo({
                top:
                  document.getElementById(
                    "detail"
                  ).offsetTop - 10,
                behavior: "smooth"
              });
            }


            updateLens();
          </script>

        </body>
        </html>

    command:
      - /bin/sh
      - -c
      - |
          mkdir -p /app/static

          printf '%s' "$$APP_PY" > /app/app.py
          printf '%s' "$$INDEX_HTML" > /app/static/index.html

          pip install --no-cache-dir \
            flask \
            yfinance \
            pandas

          python /app/app.py