                                symbol
                            )
                        )
                    ),

                    "yahoo": (
                        "https://finance.yahoo.com/quote/"
                        + quote(symbol)
                    )
                }

            except Exception as exc:

                print(
                    "Enrichment failed:",
                    symbol,
                    str(exc)
                )

                return {
                    "rejected": True,
                    "symbol": symbol,
                    "reasons": [
                        "Data retrieval failed"
                    ]
                }


