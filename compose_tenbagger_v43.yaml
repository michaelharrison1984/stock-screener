services:
  stock-screener:
    image: python:3.12-slim
    container_name: stock-screener
    restart: unless-stopped
    ports:
    - 8095:8095
    environment:
      PYTHONUNBUFFERED: '1'
      APP_PY: "from flask import Flask, jsonify, request, send_from_directory\nimport yfinance as yf\nfrom yfinance import EquityQuery\nimport pandas as pd\nimport math\nimport time\nimport threading\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom urllib.parse import quote\n\napp = Flask(__name__, static_folder=\"/app/static\")\n\n@app.errorhandler(Exception)\ndef handle_exception(exc):\n    print(\"Unhandled request error:\", repr(exc))\n    return jsonify({\"error\": str(exc), \"type\": type(exc).__name__}), 500\n\n# ============================================================\n# CONFIG\n# ============================================================\n\nCACHE_SECONDS = 3600\nMAX_ENRICH = 280\nDISCOVERY_PER_LANE = 35\nTENBAGGER_DISCOVERY_PER_LANE = 50\nTENBAGGER_MAX_ENRICH = 140\n\ncache = {}\ncache_lock = threading.Lock()\n\nfx_cache = {}\nfx_lock = threading.Lock()\n\nREGIONS = {\n    \"global\": [\n        \"us\", \"gb\", \"ca\",\n        \"de\", \"fr\", \"nl\"\
        , \"ch\", \"se\", \"dk\", \"no\", \"fi\",\n        \"es\", \"it\", \"be\", \"at\", \"ie\",\n        \"jp\", \"kr\", \"au\", \"hk\", \"sg\", \"tw\", \"in\", \"nz\"\n    ],\n\n    \"us\": [\"us\"],\n    \"gb\": [\"gb\"],\n    \"ca\": [\"ca\"],\n\n    \"europe\": [\n        \"de\", \"fr\", \"nl\", \"ch\", \"se\", \"dk\", \"no\", \"fi\",\n        \"es\", \"it\", \"be\", \"at\", \"ie\"\n    ],\n\n    \"japan\": [\"jp\"],\n    \"korea\": [\"kr\"],\n    \"australia\": [\"au\"],\n\n    \"asia\": [\n        \"jp\", \"kr\", \"au\", \"hk\", \"sg\", \"tw\", \"in\", \"nz\"\n    ],\n\n    \"emerging\": [\n        \"in\", \"br\", \"mx\", \"za\", \"id\", \"my\", \"th\", \"ph\"\n    ]\n}\n\nREGION_NAMES = {\n    \"us\": \"United States\",\n    \"gb\": \"United Kingdom\",\n    \"ca\": \"Canada\",\n    \"de\": \"Germany\",\n    \"fr\": \"France\",\n    \"nl\": \"Netherlands\",\n    \"ch\": \"Switzerland\",\n    \"se\": \"Sweden\",\n    \"dk\": \"Denmark\",\n    \"no\": \"Norway\",\n    \"fi\": \"Finland\"\
        ,\n    \"es\": \"Spain\",\n    \"it\": \"Italy\",\n    \"be\": \"Belgium\",\n    \"at\": \"Austria\",\n    \"ie\": \"Ireland\",\n    \"jp\": \"Japan\",\n    \"kr\": \"South Korea\",\n    \"au\": \"Australia\",\n    \"hk\": \"Hong Kong\",\n    \"sg\": \"Singapore\",\n    \"tw\": \"Taiwan\",\n    \"in\": \"India\",\n    \"nz\": \"New Zealand\",\n    \"br\": \"Brazil\",\n    \"mx\": \"Mexico\",\n    \"za\": \"South Africa\",\n    \"id\": \"Indonesia\",\n    \"my\": \"Malaysia\",\n    \"th\": \"Thailand\",\n    \"ph\": \"Philippines\"\n}\n\nSECTORS = [\n    \"Basic Materials\",\n    \"Communication Services\",\n    \"Consumer Cyclical\",\n    \"Consumer Defensive\",\n    \"Energy\",\n    \"Financial Services\",\n    \"Healthcare\",\n    \"Industrials\",\n    \"Real Estate\",\n    \"Technology\",\n    \"Utilities\"\n]\n\nPRESETS = {\n    \"opportunity\": {\n        \"name\": \"Opportunity\",\n        \"quality_weight\": 40,\n        \"value_weight\": 40,\n        \"growth_weight\": 20,\n\
        \        \"min_score\": 60,\n        \"min_cap\": 500,\n        \"max_cap\": 0\n    },\n\n    \"deepvalue\": {\n        \"name\": \"Deep Value\",\n        \"quality_weight\": 25,\n        \"value_weight\": 60,\n        \"growth_weight\": 15,\n        \"min_score\": 58,\n        \"min_cap\": 300,\n        \"max_cap\": 0\n    },\n\n    \"compounder\": {\n        \"name\": \"Quality Compounder\",\n        \"quality_weight\": 60,\n        \"value_weight\": 20,\n        \"growth_weight\": 20,\n        \"min_score\": 65,\n        \"min_cap\": 750,\n        \"max_cap\": 0\n    },\n\n    \"growthvalue\": {\n        \"name\": \"Growth at Value\",\n        \"quality_weight\": 35,\n        \"value_weight\": 25,\n        \"growth_weight\": 40,\n        \"min_score\": 60,\n        \"min_cap\": 500,\n        \"max_cap\": 0\n    },\n\n    \"smallcap\": {\n        \"name\": \"Small Cap Opportunity\",\n        \"quality_weight\": 45,\n        \"value_weight\": 35,\n        \"growth_weight\": 20,\n\
        \        \"min_score\": 55,\n        \"min_cap\": 100,\n        \"max_cap\": 1500\n    },\n\n    \"tenbagger\": {\n        \"name\": \"Tenbagger / Lynch\",\n        \"quality_weight\": 25,\n        \"value_weight\": 20,\n        \"growth_weight\": 55,\n        \"min_score\": 45,\n        \"min_cap\": 150,\n        \"max_cap\": 7500\n    }\n}\n\n# ============================================================\n# BASIC HELPERS\n# ============================================================\n\ndef valid_number(value):\n    try:\n        if value is None:\n            return False\n        value = float(value)\n        return math.isfinite(value)\n    except Exception:\n        return False\n\n\ndef num(value):\n    if valid_number(value):\n        return float(value)\n    return None\n\n\ndef clamp(value, low=0, high=100):\n    if value is None:\n        return None\n    return max(low, min(high, value))\n\n\ndef percent_display(value):\n    if value is None:\n        return None\n  \
        \  return value * 100\n\n\ndef weighted_score(parts):\n    total_weight = 0\n    total_score = 0\n\n    for score, weight in parts:\n        if score is None:\n            continue\n\n        total_score += score * weight\n        total_weight += weight\n\n    if total_weight == 0:\n        return None\n\n    return total_score / total_weight\n\n\ndef safe_info(ticker):\n    try:\n        info = ticker.info\n        return info if isinstance(info, dict) else {}\n    except Exception:\n        return {}\n\n\ndef safe_statement(ticker, attribute):\n    try:\n        frame = getattr(ticker, attribute)\n        if frame is None:\n            return pd.DataFrame()\n        return frame\n    except Exception:\n        return pd.DataFrame()\n\n\ndef statement_values(frame, names, max_years=5):\n    if frame is None or frame.empty:\n        return []\n\n    for name in names:\n        if name not in frame.index:\n            continue\n\n        try:\n            series = frame.loc[name].dropna()\n\
        \n            # Yahoo normally returns newest year first.\n            vals = []\n\n            for value in list(series.values)[::-1]:\n                if valid_number(value):\n                    vals.append(float(value))\n\n            return vals[-max_years:]\n\n        except Exception:\n            pass\n\n    return []\n\n\ndef latest_statement_value(frame, names):\n    vals = statement_values(frame, names, 5)\n\n    if not vals:\n        return None\n\n    return vals[-1]\n\n\ndef cagr(values):\n    vals = [v for v in values if valid_number(v)]\n\n    if len(vals) < 2:\n        return None\n\n    start = vals[0]\n    end = vals[-1]\n    periods = len(vals) - 1\n\n    if start <= 0 or end <= 0 or periods <= 0:\n        return None\n\n    try:\n        return (end / start) ** (1 / periods) - 1\n    except Exception:\n        return None\n\n\n# ============================================================\n# GBP MARKET CAP NORMALISATION\n# ============================================================\n\
        \ndef get_fx_to_gbp(currency):\n    if not currency:\n        return None\n\n    currency = str(currency).upper()\n\n    if currency == \"GBP\":\n        return 1.0\n\n    # Yahoo occasionally reports London quote currency as GBp/GBX.\n    if currency in (\"GBPENCE\", \"GBX\", \"GBP.\", \"GBPENNY\", \"GBPENCE\"):\n        return 0.01\n\n    now = time.time()\n\n    with fx_lock:\n        cached = fx_cache.get(currency)\n\n        if cached and now - cached[\"time\"] < 3600:\n            return cached[\"rate\"]\n\n    try:\n        pair = currency + \"GBP=X\"\n        ticker = yf.Ticker(pair)\n\n        price = None\n\n        try:\n            price = ticker.fast_info[\"last_price\"]\n        except Exception:\n            pass\n\n        if not valid_number(price):\n            hist = ticker.history(period=\"5d\")\n\n            if not hist.empty:\n                price = hist[\"Close\"].dropna().iloc[-1]\n\n        if valid_number(price):\n            rate = float(price)\n\n  \
        \          with fx_lock:\n                fx_cache[currency] = {\n                    \"rate\": rate,\n                    \"time\": now\n                }\n\n            return rate\n\n    except Exception:\n        pass\n\n    return None\n\n\ndef market_cap_gbp(market_cap, currency):\n    if not valid_number(market_cap):\n        return None\n\n    rate = get_fx_to_gbp(currency)\n\n    if rate is None:\n        return None\n\n    return float(market_cap) * rate\n\n\n# ============================================================\n# SCORE COMPONENTS\n# ============================================================\n\ndef score_roic(value):\n    if value is None:\n        return None\n\n    # value supplied as decimal: 0.15 = 15%\n    pct = value * 100\n\n    if pct <= 3:\n        return 0\n    if pct >= 25:\n        return 100\n\n    return clamp((pct - 3) / 22 * 100)\n\n\ndef score_roe(value):\n    if value is None:\n        return None\n\n    pct = value * 100\n\n    if pct <= 0:\n\
        \        return 0\n    if pct >= 25:\n        return 100\n\n    return clamp(pct / 25 * 100)\n\n\ndef score_margin(value):\n    if value is None:\n        return None\n\n    pct = value * 100\n\n    if pct <= 0:\n        return 0\n    if pct >= 25:\n        return 100\n\n    return clamp(pct / 25 * 100)\n\n\ndef score_debt_equity(value):\n    if value is None:\n        return None\n\n    # yfinance usually reports 50 as 50%, not 0.50.\n    if value <= 20:\n        return 100\n    if value >= 160:\n        return 0\n\n    return clamp(100 - ((value - 20) / 140 * 100))\n\n\ndef score_pe(value):\n    if value is None or value <= 0:\n        return None\n\n    if value <= 8:\n        return 100\n    if value <= 12:\n        return 90\n    if value <= 16:\n        return 78\n    if value <= 20:\n        return 65\n    if value <= 25:\n        return 52\n    if value <= 35:\n        return 35\n    if value <= 50:\n        return 18\n\n    return 5\n\n\ndef score_fcf_yield(value):\n   \
        \ if value is None:\n        return None\n\n    pct = value * 100\n\n    if pct >= 10:\n        return 100\n    if pct >= 7:\n        return 88\n    if pct >= 5:\n        return 74\n    if pct >= 3:\n        return 55\n    if pct >= 1:\n        return 30\n    if pct >= 0:\n        return 10\n\n    return 0\n\n\ndef score_peg(value):\n    if value is None or value <= 0:\n        return None\n\n    if value <= 0.7:\n        return 100\n    if value <= 1.0:\n        return 90\n    if value <= 1.5:\n        return 70\n    if value <= 2:\n        return 50\n    if value <= 3:\n        return 25\n\n    return 10\n\n\ndef score_ev_ebitda(value):\n    if value is None or value <= 0:\n        return None\n\n    if value <= 6:\n        return 100\n    if value <= 9:\n        return 85\n    if value <= 12:\n        return 70\n    if value <= 16:\n        return 50\n    if value <= 22:\n        return 30\n\n    return 10\n\n\ndef score_price_book(value):\n    if value is None or value <= 0:\n\
        \        return None\n\n    if value <= 1:\n        return 100\n    if value <= 1.5:\n        return 85\n    if value <= 2:\n        return 70\n    if value <= 3:\n        return 50\n    if value <= 5:\n        return 25\n\n    return 10\n\n\ndef score_growth(value):\n    if value is None:\n        return None\n\n    # -5% = 0, 25% = 100\n    return clamp((value + 0.05) / 0.30 * 100)\n\n\ndef score_cagr(value):\n    return score_growth(value)\n\n\n# ============================================================\n# ROIC + EARNINGS STABILITY\n# ============================================================\n\ndef calculate_roic(income, balance):\n    operating_income = latest_statement_value(\n        income,\n        [\"Operating Income\", \"OperatingIncome\"]\n    )\n\n    equity = latest_statement_value(\n        balance,\n        [\n            \"Stockholders Equity\",\n            \"StockholdersEquity\",\n            \"Total Stockholder Equity\",\n            \"Total Equity Gross\
        \ Minority Interest\"\n        ]\n    )\n\n    debt = latest_statement_value(\n        balance,\n        [\n            \"Total Debt\",\n            \"TotalDebt\",\n            \"Long Term Debt And Capital Lease Obligation\"\n        ]\n    )\n\n    cash = latest_statement_value(\n        balance,\n        [\n            \"Cash Cash Equivalents And Short Term Investments\",\n            \"Cash And Cash Equivalents\",\n            \"Cash\"\n        ]\n    )\n\n    tax_provision = latest_statement_value(\n        income,\n        [\"Tax Provision\", \"TaxProvision\"]\n    )\n\n    pretax_income = latest_statement_value(\n        income,\n        [\n            \"Pretax Income\",\n            \"PretaxIncome\",\n            \"Income Before Tax\"\n        ]\n    )\n\n    if operating_income is None or equity is None:\n        return None\n\n    if debt is None:\n        debt = 0\n\n    if cash is None:\n        cash = 0\n\n    tax_rate = 0.21\n\n    if (\n        tax_provision is not\
        \ None\n        and pretax_income is not None\n        and pretax_income > 0\n    ):\n        tax_rate = clamp(\n            tax_provision / pretax_income,\n            0,\n            0.35\n        )\n\n    invested_capital = equity + debt - cash\n\n    if invested_capital <= 0:\n        return None\n\n    nopat = operating_income * (1 - tax_rate)\n\n    return nopat / invested_capital\n\n\ndef earnings_stability(income):\n    earnings = statement_values(\n        income,\n        [\"Net Income\", \"NetIncome\"],\n        max_years=4\n    )\n\n    if len(earnings) < 2:\n        return None\n\n    positive_ratio = (\n        len([x for x in earnings if x > 0]) / len(earnings)\n    )\n\n    positive_score = positive_ratio * 60\n\n    major_drops = 0\n    comparisons = 0\n\n    for old, new in zip(earnings[:-1], earnings[1:]):\n        if old <= 0:\n            continue\n\n        comparisons += 1\n        change = (new - old) / abs(old)\n\n        if change < -0.35:\n            major_drops\
        \ += 1\n\n    if comparisons == 0:\n        drop_score = 20\n    else:\n        drop_score = (\n            1 - major_drops / comparisons\n        ) * 40\n\n    return clamp(positive_score + drop_score)\n\n\n# ============================================================\n# TRADINGVIEW SYMBOL\n# ============================================================\n\ndef tradingview_symbol(symbol):\n    s = symbol.upper()\n\n    suffixes = {\n        \".L\": \"LSE:\",\n        \".TO\": \"TSX:\",\n        \".V\": \"TSXV:\",\n        \".T\": \"TSE:\",\n        \".KS\": \"KRX:\",\n        \".KQ\": \"KOSDAQ:\",\n        \".AX\": \"ASX:\",\n        \".HK\": \"HKEX:\",\n        \".DE\": \"XETR:\",\n        \".PA\": \"EURONEXT:\",\n        \".AS\": \"EURONEXT:\",\n        \".SW\": \"SIX:\",\n        \".ST\": \"OMXSTO:\",\n        \".CO\": \"OMXCOP:\",\n        \".OL\": \"OSL:\",\n        \".HE\": \"OMXHEX:\",\n        \".MI\": \"MIL:\",\n        \".MC\": \"BME:\",\n        \".BR\": \"EURONEXT:\"\n\
        \    }\n\n    for suffix, exchange in suffixes.items():\n        if s.endswith(suffix):\n            base = s[:-len(suffix)]\n            return exchange + base\n\n    return s\n\n\n# ============================================================\n# DISCOVERY\n# ============================================================\n\ndef build_base_query(region, sector=None, extra=None):\n    rules = [\n        EquityQuery(\"eq\", [\"region\", region])\n    ]\n\n    if sector:\n        rules.append(\n            EquityQuery(\"eq\", [\"sector\", sector])\n        )\n\n    if extra:\n        rules.extend(extra)\n\n    return EquityQuery(\"and\", rules)\n\n\ndef screen_lane(region, sector, name, lane_size=None):\n    lane_size = lane_size or DISCOVERY_PER_LANE\n    try:\n\n        if name == \"size\":\n            query = build_base_query(region, sector)\n\n            response = yf.screen(\n                query,\n                size=lane_size,\n                sortField=\"intradaymarketcap\"\
        ,\n                sortAsc=False\n            )\n\n        elif name == \"value\":\n            query = build_base_query(\n                region,\n                sector,\n                [\n                    EquityQuery(\n                        \"gt\",\n                        [\"peratio.lasttwelvemonths\", 0]\n                    )\n                ]\n            )\n\n            response = yf.screen(\n                query,\n                size=lane_size,\n                sortField=\"peratio.lasttwelvemonths\",\n                sortAsc=True\n            )\n\n        elif name == \"cfo\":\n            query = build_base_query(region, sector)\n\n            response = yf.screen(\n                query,\n                size=lane_size,\n                sortField=\"cashfromoperations1yrgrowth.lasttwelvemonths\",\n                sortAsc=False\n            )\n\n        elif name == \"fcf\":\n            query = build_base_query(region, sector)\n\n            response = yf.screen(\n\
        \                query,\n                size=lane_size,\n                sortField=\"leveredfreecashflow1yrgrowth.lasttwelvemonths\",\n                sortAsc=False\n            )\n\n        elif name == \"revenue_growth\":\n            query = build_base_query(region, sector)\n\n            response = yf.screen(\n                query,\n                size=lane_size,\n                sortField=\"totalrevenues1yrgrowth.lasttwelvemonths\",\n                sortAsc=False\n            )\n\n        elif name == \"earnings_growth\":\n            query = build_base_query(region, sector)\n\n            response = yf.screen(\n                query,\n                size=lane_size,\n                sortField=\"netincome1yrgrowth.lasttwelvemonths\",\n                sortAsc=False\n            )\n\n        else:\n            return []\n\n        return response.get(\"quotes\", [])\n\n    except Exception as exc:\n        print(\n            \"Discovery lane failed:\",\n            region,\n\
        \            name,\n            str(exc)\n        )\n        return []\n\n\ndef discover_region(region, sector=None, preset_key=\"opportunity\"):\n    found = {}\n\n    lanes = [\"size\", \"value\", \"cfo\", \"fcf\"]\n    if preset_key == \"tenbagger\":\n        # Cast a deliberately wide net. Value/CFO/FCF lanes provide\n        # fallbacks when Yahoo growth fields are sparse for a market.\n        lanes = [\"revenue_growth\", \"earnings_growth\", \"fcf\"]\n\n    lane_size = (\n        TENBAGGER_DISCOVERY_PER_LANE\n        if preset_key == \"tenbagger\"\n        else DISCOVERY_PER_LANE\n    )\n\n    for lane in lanes:\n        quotes = screen_lane(\n            region,\n            sector,\n            lane,\n            lane_size\n        )\n\n        for item in quotes:\n            symbol = item.get(\"symbol\")\n\n            if not symbol:\n                continue\n\n            if symbol not in found:\n                found[symbol] = {\n                    \"symbol\": symbol,\n\
        \                    \"region\": region,\n                    \"hits\": 0,\n                    \"quote\": item,\n                    \"lanes\": []\n                }\n\n            found[symbol][\"hits\"] += 1\n            found[symbol][\"lanes\"].append(lane)\n\n    return list(found.values())\n\n\ndef candidate_market_cap(candidate):\n    q = candidate.get(\"quote\", {})\n\n    market_cap = (\n        q.get(\"marketCap\")\n        or q.get(\"intradaymarketcap\")\n    )\n\n    currency = (\n        q.get(\"currency\")\n        or q.get(\"financialCurrency\")\n    )\n\n    cap_gbp = market_cap_gbp(\n        market_cap,\n        currency\n    )\n\n    if cap_gbp is None:\n        return None\n\n    return cap_gbp / 1_000_000\n\n\ndef candidate_pe(candidate):\n    q = candidate.get(\"quote\", {})\n\n    for key in [\n        \"trailingPE\",\n        \"peratio\",\n        \"peratio.lasttwelvemonths\"\n    ]:\n        if valid_number(q.get(key)):\n            return float(q.get(key))\n\
        \n    return None\n\n\ndef candidate_priority(candidate, preset_key=\"opportunity\"):\n    hits = candidate.get(\"hits\", 0)\n    pe = candidate_pe(candidate)\n\n    pe_bonus = 0\n\n    if pe is not None and pe > 0:\n        pe_bonus = max(0, 30 - min(pe, 30))\n\n    if preset_key == \"tenbagger\":\n        q = candidate.get(\"quote\", {})\n        rev_growth = num(q.get(\"totalrevenues1yrgrowth.lasttwelvemonths\") or q.get(\"revenueGrowth\"))\n        growth_bonus = max(0, min((rev_growth or 0) * 100, 50))\n        return hits * 100 + growth_bonus\n\n    return hits * 100 + pe_bonus\n\n\ndef discover_candidates(\n    regions,\n    sector,\n    min_cap,\n    max_cap,\n    preset_key=\"opportunity\"\n):\n    all_candidates = []\n\n    workers = min(6, len(regions))\n\n    with ThreadPoolExecutor(\n        max_workers=max(1, workers)\n    ) as executor:\n\n        futures = {\n            executor.submit(\n                discover_region,\n                region,\n                sector,\n\
        \                preset_key\n            ): region\n            for region in regions\n        }\n\n        for future in as_completed(futures):\n            try:\n                all_candidates.extend(\n                    future.result()\n                )\n            except Exception as exc:\n                print(\n                    \"Region discovery error:\",\n                    exc\n                )\n\n    # --------------------------------------------------------\n    # Deduplicate\n    # --------------------------------------------------------\n\n    combined = {}\n\n    for item in all_candidates:\n        symbol = item[\"symbol\"]\n\n        if symbol not in combined:\n            combined[symbol] = item\n        else:\n            combined[symbol][\"hits\"] += item[\"hits\"]\n\n            combined[symbol][\"lanes\"] = list(\n                set(\n                    combined[symbol][\"lanes\"]\n                    + item[\"lanes\"]\n                )\n         \
        \   )\n\n    candidates = list(combined.values())\n\n    # --------------------------------------------------------\n    # Apply GBP cap filter where quote data allows it.\n    #\n    # Unknown cap/currency is NOT rejected here because\n    # enrichment may provide the missing information.\n    # --------------------------------------------------------\n\n    filtered = []\n\n    for candidate in candidates:\n        cap = candidate_market_cap(candidate)\n\n        if cap is not None:\n            if min_cap and cap < min_cap:\n                continue\n\n            if max_cap and max_cap > 0 and cap > max_cap:\n                continue\n\n        filtered.append(candidate)\n\n    # --------------------------------------------------------\n    # Country balancing.\n    #\n    # This prevents Global from becoming almost entirely\n    # US stocks.\n    # --------------------------------------------------------\n\n    by_region = {}\n\n    for candidate in filtered:\n        region\
        \ = candidate[\"region\"]\n\n        by_region.setdefault(\n            region,\n            []\n        ).append(candidate)\n\n    region_count = max(\n        1,\n        len(by_region)\n    )\n\n    quota = max(\n        10,\n        int(MAX_ENRICH / region_count)\n    )\n\n    selected = []\n\n    for region, items in by_region.items():\n\n        items.sort(\n            key=lambda x: candidate_priority(x, preset_key),\n            reverse=True\n        )\n\n        selected.extend(\n            items[:quota]\n        )\n\n    selected.sort(\n        key=lambda x: candidate_priority(x, preset_key),\n        reverse=True\n    )\n\n    limit = TENBAGGER_MAX_ENRICH if preset_key == \"tenbagger\" else MAX_ENRICH\n    return selected[:limit]\n\n\n# ============================================================\n# COMPANY ENRICHMENT\n# ============================================================\n\ndef enrich_candidate(candidate, preset_key=\"opportunity\"):\n    symbol = candidate[\"\
        symbol\"]\n    region = candidate[\"region\"]\n\n    try:\n        ticker = yf.Ticker(symbol)\n\n        info = safe_info(ticker)\n\n        income = safe_statement(\n            ticker,\n            \"income_stmt\"\n        )\n\n        balance = safe_statement(\n            ticker,\n            \"balance_sheet\"\n        )\n\n        cashflow = safe_statement(\n            ticker,\n            \"cashflow\"\n        )\n\n        sector = (\n            info.get(\"sector\")\n            or candidate.get(\n                \"quote\",\n                {}\n            ).get(\"sector\")\n            or \"Unknown\"\n        )\n\n        is_financial = (\n            sector == \"Financial Services\"\n        )\n\n        company = (\n            info.get(\"longName\")\n            or info.get(\"shortName\")\n            or candidate.get(\n                \"quote\",\n                {}\n            ).get(\"longName\")\n            or symbol\n        )\n\n        market_cap = num(\n     \
        \       info.get(\"marketCap\")\n        )\n\n        currency = (\n            info.get(\"currency\")\n            or info.get(\"financialCurrency\")\n            or candidate.get(\n                \"quote\",\n                {}\n            ).get(\"currency\")\n        )\n\n        cap_gbp = market_cap_gbp(\n            market_cap,\n            currency\n        )\n\n        cap_gbp_m = (\n            cap_gbp / 1_000_000\n            if cap_gbp is not None\n            else None\n        )\n\n        pe = num(\n            info.get(\"trailingPE\")\n        )\n\n        peg = num(\n            info.get(\"pegRatio\")\n        )\n\n        ev_ebitda = num(\n            info.get(\"enterpriseToEbitda\")\n        )\n\n        pb = num(\n            info.get(\"priceToBook\")\n        )\n\n        roe = num(\n            info.get(\"returnOnEquity\")\n        )\n\n        operating_margin = num(\n            info.get(\"operatingMargins\")\n        )\n\n        profit_margin = num(\n   \
        \         info.get(\"profitMargins\")\n        )\n\n        debt_equity = num(\n            info.get(\"debtToEquity\")\n        )\n\n        free_cash_flow = num(\n            info.get(\"freeCashflow\")\n        )\n\n        revenue_growth = num(\n            info.get(\"revenueGrowth\")\n        )\n\n        earnings_growth = num(\n            info.get(\"earningsGrowth\")\n        )\n\n        gross_margin = num(info.get(\"grossMargins\"))\n        forward_pe = num(info.get(\"forwardPE\"))\n        held_insiders = num(info.get(\"heldPercentInsiders\"))\n        held_institutions = num(info.get(\"heldPercentInstitutions\"))\n        shares_outstanding = num(info.get(\"sharesOutstanding\"))\n        shares_short_prior = num(info.get(\"sharesShortPriorMonth\"))\n        total_debt = num(info.get(\"totalDebt\"))\n        total_cash = num(info.get(\"totalCash\"))\n        ebitda = num(info.get(\"ebitda\"))\n\n        net_debt_ebitda = None\n        if total_debt is not None and ebitda\
        \ is not None and ebitda > 0:\n            net_debt_ebitda = (total_debt - (total_cash or 0)) / ebitda\n\n        trailing_eps = num(\n            info.get(\"trailingEps\")\n        )\n\n        fcf_yield = None\n\n        if (\n            free_cash_flow is not None\n            and market_cap is not None\n            and market_cap > 0\n        ):\n            fcf_yield = (\n                free_cash_flow / market_cap\n            )\n\n        roic = calculate_roic(\n            income,\n            balance\n        )\n\n        stability = earnings_stability(\n            income\n        )\n\n        revenue_history = statement_values(\n            income,\n            [\"Total Revenue\", \"TotalRevenue\"],\n            max_years=5\n        )\n\n        earnings_history = statement_values(\n            income,\n            [\"Net Income\", \"NetIncome\"],\n            max_years=5\n        )\n\n        revenue_cagr = cagr(\n            revenue_history\n        )\n\n        earnings_cagr\
        \ = cagr(\n            earnings_history\n        )\n\n        latest_net_income = (\n            earnings_history[-1]\n            if earnings_history\n            else None\n        )\n\n        # ----------------------------------------------------\n        # QUALITY GATE\n        # ----------------------------------------------------\n\n        reject_reasons = []\n\n        profitable = False\n\n        if (\n            latest_net_income is not None\n            and latest_net_income > 0\n        ):\n            profitable = True\n\n        if (\n            trailing_eps is not None\n            and trailing_eps > 0\n        ):\n            profitable = True\n\n        if (\n            pe is not None\n            and pe > 0\n        ):\n            profitable = True\n\n        if not profitable:\n            reject_reasons.append(\n                \"No evidence of positive trailing earnings\"\n            )\n\n        if not is_financial:\n\n            if (\n             \
        \   free_cash_flow is not None\n                and free_cash_flow < 0\n            ):\n                reject_reasons.append(\n                    \"Negative free cash flow\"\n                )\n\n            if (\n                operating_margin is not None\n                and operating_margin <= 0\n            ):\n                reject_reasons.append(\n                    \"Negative operating margin\"\n                )\n\n            if (\n                roic is not None\n                and roic < 0.05\n            ):\n                reject_reasons.append(\n                    \"ROIC below 5%\"\n                )\n\n            if (\n                debt_equity is not None\n                and debt_equity > 150\n            ):\n                reject_reasons.append(\n                    \"Debt/equity above 150%\"\n                )\n\n        else:\n\n            if (\n                roe is not None\n                and roe <= 0\n            ):\n                reject_reasons.append(\n\
        \                    \"Negative ROE\"\n                )\n\n            if (\n                profit_margin is not None\n                and profit_margin <= 0\n            ):\n                reject_reasons.append(\n                    \"Negative profit margin\"\n                )\n\n        if len(earnings_history) >= 3:\n            positive_years = len(\n                [\n                    x\n                    for x in earnings_history\n                    if x > 0\n                ]\n            )\n\n            if positive_years < 2:\n                reject_reasons.append(\n                    \"Weak multi-year earnings history\"\n                )\n\n        if reject_reasons and preset_key != \"tenbagger\":\n            return {\n                \"rejected\": True,\n                \"symbol\": symbol,\n                \"reasons\": reject_reasons\n            }\n\n        # Lynch mode deliberately tolerates an earlier-stage company, but\n        # still rejects clearly\
        \ broken balance sheets / economics.\n        if preset_key == \"tenbagger\":\n            severe = []\n            if debt_equity is not None and debt_equity > 250:\n                severe.append(\"Debt/equity above 250%\")\n            if revenue_growth is not None and revenue_growth < -0.10:\n                severe.append(\"Revenue shrinking more than 10%\")\n            if severe:\n                return {\"rejected\": True, \"symbol\": symbol, \"reasons\": severe}\n\n        # ----------------------------------------------------\n        # QUALITY SCORE\n        # ----------------------------------------------------\n\n        if is_financial:\n\n            quality = weighted_score([\n                (score_roe(roe), 40),\n                (\n                    score_margin(\n                        profit_margin\n                    ),\n                    30\n                ),\n                (stability, 30)\n            ])\n\n        else:\n\n            quality = weighted_score([\n\
        \                (score_roic(roic), 30),\n                (score_roe(roe), 20),\n                (\n                    score_margin(\n                        operating_margin\n                    ),\n                    20\n                ),\n                (\n                    score_debt_equity(\n                        debt_equity\n                    ),\n                    15\n                ),\n                (stability, 15)\n            ])\n\n        # ----------------------------------------------------\n        # VALUE SCORE\n        # ----------------------------------------------------\n\n        if is_financial:\n\n            value = weighted_score([\n                (score_pe(pe), 45),\n                (\n                    score_price_book(pb),\n                    35\n                ),\n                (score_peg(peg), 20)\n            ])\n\n        else:\n\n            value = weighted_score([\n                (score_pe(pe), 35),\n                (\n    \
        \                score_fcf_yield(\n                        fcf_yield\n                    ),\n                    35\n                ),\n                (score_peg(peg), 15),\n                (\n                    score_ev_ebitda(\n                        ev_ebitda\n                    ),\n                    15\n                )\n            ])\n\n        # ----------------------------------------------------\n        # GROWTH SCORE\n        # ----------------------------------------------------\n\n        growth = weighted_score([\n            (\n                score_growth(\n                    revenue_growth\n                ),\n                30\n            ),\n            (\n                score_growth(\n                    earnings_growth\n                ),\n                30\n            ),\n            (\n                score_cagr(\n                    revenue_cagr\n                ),\n                20\n            ),\n            (\n                score_cagr(\n\
        \                    earnings_cagr\n                ),\n                20\n            )\n        ])\n\n        # ----------------------------------------------------\n        # TENBAGGER / LYNCH SCORE\n        # ----------------------------------------------------\n\n        tenbagger_score = weighted_score([\n            (score_growth(revenue_growth), 20),\n            (score_cagr(revenue_cagr), 15),\n            (score_growth(earnings_growth), 12),\n            (score_cagr(earnings_cagr), 8),\n            (score_peg(peg), 12),\n            (score_roic(roic), 10),\n            (score_debt_equity(debt_equity), 8),\n            (score_margin(gross_margin), 5),\n            (score_fcf_yield(fcf_yield), 5),\n            (100 if cap_gbp_m is not None and 300 <= cap_gbp_m <= 3000 else\n             75 if cap_gbp_m is not None and 150 <= cap_gbp_m <= 7500 else 30, 5)\n        ])\n\n        tenbagger_stage = \"Watch\"\n        if tenbagger_score is not None:\n            if tenbagger_score\
        \ >= 82:\n                tenbagger_stage = \"Scaling\"\n            elif tenbagger_score >= 72:\n                tenbagger_stage = \"Emerging\"\n            elif tenbagger_score >= 62:\n                tenbagger_stage = \"Compounder\"\n\n        tenbagger_notes = []\n        if revenue_growth is not None and revenue_growth >= 0.20:\n            tenbagger_notes.append(\"Revenue growth above 20%\")\n        if revenue_cagr is not None and revenue_cagr >= 0.15:\n            tenbagger_notes.append(\"Multi-year revenue CAGR above 15%\")\n        if peg is not None and 0 < peg <= 1.0:\n            tenbagger_notes.append(\"PEG at or below 1.0\")\n        if roic is not None and roic >= 0.15:\n            tenbagger_notes.append(\"ROIC above 15%\")\n        if net_debt_ebitda is not None and net_debt_ebitda < 1.0:\n            tenbagger_notes.append(\"Low net leverage\")\n        if cap_gbp_m is not None and 300 <= cap_gbp_m <= 3000:\n            tenbagger_notes.append(\"Market cap sits\
        \ in preferred tenbagger range\")\n\n        # ----------------------------------------------------\n        # DATA COMPLETENESS\n        # ----------------------------------------------------\n\n        if is_financial:\n            relevant = [\n                roe,\n                profit_margin,\n                stability,\n                pe,\n                pb,\n                peg,\n                revenue_growth,\n                earnings_growth,\n                revenue_cagr,\n                earnings_cagr\n            ]\n\n        else:\n            relevant = [\n                roic,\n                roe,\n                operating_margin,\n                debt_equity,\n                stability,\n                pe,\n                fcf_yield,\n                peg,\n                ev_ebitda,\n                revenue_growth,\n                earnings_growth,\n                revenue_cagr,\n                earnings_cagr\n            ]\n\n        available = len(\n   \
        \         [\n                value\n                for value in relevant\n                if value is not None\n            ]\n        )\n\n        completeness = round(\n            available\n            / len(relevant)\n            * 100\n        )\n\n        # ----------------------------------------------------\n        # STRENGTHS / CAUTIONS\n        # ----------------------------------------------------\n\n        strengths = []\n        cautions = []\n        missing = []\n\n        if roic is not None:\n            if roic >= 0.15:\n                strengths.append(\n                    \"Strong return on invested capital\"\n                )\n            elif roic < 0.08:\n                cautions.append(\n                    \"ROIC is relatively weak\"\n                )\n\n        if roe is not None and roe >= 0.15:\n            strengths.append(\n                \"Strong return on equity\"\n            )\n\n        if (\n            fcf_yield is not None\n         \
        \   and fcf_yield >= 0.05\n        ):\n            strengths.append(\n                \"Attractive free-cash-flow yield\"\n            )\n\n        if (\n            revenue_cagr is not None\n            and revenue_cagr >= 0.08\n        ):\n            strengths.append(\n                \"Healthy multi-year revenue growth\"\n            )\n\n        if (\n            earnings_cagr is not None\n            and earnings_cagr >= 0.08\n        ):\n            strengths.append(\n                \"Healthy multi-year earnings growth\"\n            )\n\n        if (\n            debt_equity is not None\n            and debt_equity <= 50\n        ):\n            strengths.append(\n                \"Conservative leverage\"\n            )\n\n        if pe is not None and 0 < pe <= 15:\n            strengths.append(\n                \"Modest earnings valuation\"\n            )\n\n        if (\n            revenue_growth is not None\n            and revenue_growth < 0\n        ):\n         \
        \   cautions.append(\n                \"Recent revenue is declining\"\n            )\n\n        if (\n            earnings_growth is not None\n            and earnings_growth < 0\n        ):\n            cautions.append(\n                \"Recent earnings are declining\"\n            )\n\n        if (\n            debt_equity is not None\n            and debt_equity > 100\n        ):\n            cautions.append(\n                \"Leverage deserves investigation\"\n            )\n\n        if (\n            pe is not None\n            and pe > 30\n        ):\n            cautions.append(\n                \"Valuation is relatively demanding\"\n            )\n\n        named_metrics = {\n            \"ROIC\": roic,\n            \"ROE\": roe,\n            \"P/E\": pe,\n            \"FCF yield\": fcf_yield,\n            \"revenue CAGR\": revenue_cagr,\n            \"earnings CAGR\": earnings_cagr\n        }\n\n        for label, metric in named_metrics.items():\n            if metric\
        \ is None:\n                missing.append(label)\n\n        return {\n            \"rejected\": False,\n\n            \"symbol\": symbol,\n            \"company\": company,\n            \"sector\": sector,\n            \"industry\": info.get(\n                \"industry\",\n                \"Unknown\"\n            ),\n\n            \"region\": region,\n            \"country\": (\n                info.get(\"country\")\n                or REGION_NAMES.get(\n                    region,\n                    region.upper()\n                )\n            ),\n\n            \"currency\": currency,\n\n            \"price\": num(\n                info.get(\n                    \"currentPrice\",\n                    info.get(\n                        \"regularMarketPrice\"\n                    )\n                )\n            ),\n\n            \"market_cap\": market_cap,\n            \"market_cap_gbp_m\": cap_gbp_m,\n\n            \"pe\": pe,\n            \"peg\": peg,\n            \"ev_ebitda\"\
        : ev_ebitda,\n            \"price_book\": pb,\n\n            \"roe\": roe,\n            \"roic\": roic,\n\n            \"operating_margin\": (\n                operating_margin\n            ),\n\n            \"profit_margin\": (\n                profit_margin\n            ),\n\n            \"debt_equity\": debt_equity,\n\n            \"free_cash_flow\": (\n                free_cash_flow\n            ),\n\n            \"fcf_yield\": fcf_yield,\n\n            \"revenue_growth\": (\n                revenue_growth\n            ),\n\n            \"earnings_growth\": (\n                earnings_growth\n            ),\n\n            \"revenue_cagr\": revenue_cagr,\n            \"earnings_cagr\": earnings_cagr,\n\n            \"stability\": stability,\n\n            \"quality\": quality,\n            \"value\": value,\n            \"growth\": growth,\n            \"tenbagger_score\": tenbagger_score,\n            \"tenbagger_stage\": tenbagger_stage,\n            \"tenbagger_notes\": tenbagger_notes,\n\
        \            \"gross_margin\": gross_margin,\n            \"forward_pe\": forward_pe,\n            \"net_debt_ebitda\": net_debt_ebitda,\n            \"held_insiders\": held_insiders,\n            \"held_institutions\": held_institutions,\n\n            \"data_completeness\": (\n                completeness\n            ),\n\n            \"strengths\": strengths,\n            \"cautions\": cautions,\n            \"missing\": missing,\n\n            \"discovery_hits\": (\n                candidate.get(\n                    \"hits\",\n                    0\n                )\n            ),\n\n            \"discovery_lanes\": (\n                candidate.get(\n                    \"lanes\",\n                    []\n                )\n            ),\n\n            \"tradingview\": (\n                \"https://www.tradingview.com/chart/?symbol=\"\n                + quote(\n                    tradingview_symbol(\n                        symbol\n                    )\n               \
        \ )\n            ),\n\n            \"yahoo\": (\n                \"https://finance.yahoo.com/quote/\"\n                + quote(symbol)\n            )\n        }\n\n    except Exception as exc:\n\n        print(\n            \"Enrichment failed:\",\n            symbol,\n            str(exc)\n        )\n\n        return {\n            \"rejected\": True,\n            \"symbol\": symbol,\n            \"reasons\": [\n                \"Data retrieval failed\"\n            ]\n        }\n\n\n# ============================================================\n# API\n# ============================================================\n\n@app.route(\"/api/screen\")\ndef api_screen():\n\n    region_key = request.args.get(\n        \"region\",\n        \"global\"\n    ).lower()\n\n    sector = request.args.get(\n        \"sector\",\n        \"\"\n    ).strip()\n\n    preset_key = request.args.get(\n        \"preset\",\n        \"opportunity\"\n    ).lower()\n\n    preset = PRESETS.get(\n        preset_key,\n\
        \        PRESETS[\"opportunity\"]\n    )\n\n    try:\n        min_cap = float(\n            request.args.get(\n                \"min_cap\",\n                preset[\"min_cap\"]\n            )\n        )\n    except Exception:\n        min_cap = preset[\"min_cap\"]\n\n    try:\n        max_cap = float(\n            request.args.get(\n                \"max_cap\",\n                preset[\"max_cap\"]\n            )\n        )\n    except Exception:\n        max_cap = preset[\"max_cap\"]\n\n    try:\n        min_score = float(\n            request.args.get(\n                \"min_score\",\n                preset[\"min_score\"]\n            )\n        )\n    except Exception:\n        min_score = preset[\"min_score\"]\n\n    if sector not in SECTORS:\n        sector = None\n\n    regions = REGIONS.get(\n        region_key,\n        REGIONS[\"global\"]\n    )\n\n    cache_key = (\n        region_key,\n        sector,\n        preset_key,\n        min_cap,\n        max_cap,\n        min_score\n\
        \    )\n\n    now = time.time()\n\n    with cache_lock:\n        cached = cache.get(\n            cache_key\n        )\n\n        if (\n            cached\n            and now - cached[\"time\"]\n            < CACHE_SECONDS\n        ):\n            return jsonify(\n                cached[\"data\"]\n            )\n\n    print(\n        \"Starting screen:\",\n        region_key,\n        sector,\n        preset_key,\n        min_cap,\n        max_cap,\n        min_score\n    )\n\n    candidates = discover_candidates(\n        regions,\n        sector,\n        min_cap,\n        max_cap,\n        preset_key\n    )\n\n    print(\n        \"Candidates selected for enrichment:\",\n        len(candidates)\n    )\n\n    enriched = []\n\n    with ThreadPoolExecutor(\n        max_workers=6\n    ) as executor:\n\n        futures = [\n            executor.submit(\n                enrich_candidate,\n                candidate,\n                preset_key\n            )\n            for candidate\
        \ in candidates\n        ]\n\n        for future in as_completed(\n            futures\n        ):\n            try:\n                result = future.result()\n\n                if (\n                    result\n                    and not result.get(\n                        \"rejected\",\n                        True\n                    )\n                ):\n                    enriched.append(\n                        result\n                    )\n\n            except Exception as exc:\n                print(\n                    \"Future failed:\",\n                    exc\n                )\n\n    results = []\n\n    for stock in enriched:\n\n        cap = stock.get(\n            \"market_cap_gbp_m\"\n        )\n\n        if cap is not None:\n\n            if (\n                min_cap\n                and cap < min_cap\n            ):\n                continue\n\n            if (\n                max_cap\n                and max_cap > 0\n                and cap > max_cap\n\
        \            ):\n                continue\n\n        if preset_key == \"tenbagger\":\n            overall = stock.get(\"tenbagger_score\")\n        else:\n            overall = weighted_score([\n            (\n                stock.get(\"quality\"),\n                preset[\n                    \"quality_weight\"\n                ]\n            ),\n            (\n                stock.get(\"value\"),\n                preset[\n                    \"value_weight\"\n                ]\n            ),\n            (\n                stock.get(\"growth\"),\n                preset[\n                    \"growth_weight\"\n                ]\n            )\n        ])\n\n        if overall is None:\n            continue\n\n        overall = round(\n            overall,\n            1\n        )\n\n        if overall < min_score:\n            continue\n\n        stock[\"overall\"] = overall\n\n        stock[\"quality\"] = (\n            round(\n                stock[\"quality\"],\n        \
        \        1\n            )\n            if stock[\"quality\"]\n            is not None\n            else None\n        )\n\n        stock[\"value\"] = (\n            round(\n                stock[\"value\"],\n                1\n            )\n            if stock[\"value\"]\n            is not None\n            else None\n        )\n\n        stock[\"growth\"] = (\n            round(\n                stock[\"growth\"],\n                1\n            )\n            if stock[\"growth\"]\n            is not None\n            else None\n        )\n\n        results.append(stock)\n\n    results.sort(\n        key=lambda x: (\n            x.get(\"overall\", 0),\n            x.get(\n                \"data_completeness\",\n                0\n            )\n        ),\n        reverse=True\n    )\n\n    results = results[:75]\n\n    payload = {\n        \"results\": results,\n\n        \"count\": len(results),\n\n        \"candidates_scanned\": (\n            len(candidates)\n        ),\n\
        \n        \"preset\": {\n            \"key\": preset_key,\n            \"name\": preset[\"name\"],\n            \"quality_weight\": (\n                preset[\n                    \"quality_weight\"\n                ]\n            ),\n            \"value_weight\": (\n                preset[\n                    \"value_weight\"\n                ]\n            ),\n            \"growth_weight\": (\n                preset[\n                    \"growth_weight\"\n                ]\n            )\n        },\n\n        \"region\": region_key,\n\n        \"regions_scanned\": regions,\n\n        \"market_cap_currency\": \"GBP\",\n\n        \"generated\": int(time.time())\n    }\n\n    with cache_lock:\n        cache[cache_key] = {\n            \"time\": now,\n            \"data\": payload\n        }\n\n    return jsonify(payload)\n\n\n@app.route(\"/health\")\ndef health():\n    return jsonify({\n        \"status\": \"ok\",\n        \"version\": \"4.3-tenbagger-timeout-fix\",\n        \"\
        service\": \"Global Opportunity Stock Screener\"\n    })\n\n\n@app.route(\"/\")\ndef index():\n    return send_from_directory(\n        \"/app/static\",\n        \"index.html\"\n    )\n\n\nif __name__ == \"__main__\":\n    app.run(\n        host=\"0.0.0.0\",\n        port=8095,\n        threaded=True\n    )\n"
      INDEX_HTML: "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\n  <title>Global Opportunity Stock Screener</title>\n\n  <style>\n    :root {\n      --bg: #1a1b26;\n      --panel: #24283b;\n      --panel2: #1f2335;\n      --border: #414868;\n      --text: #c0caf5;\n      --muted: #9aa5ce;\n      --blue: #7aa2f7;\n      --cyan: #7dcfff;\n      --green: #9ece6a;\n      --yellow: #e0af68;\n      --orange: #ff9e64;\n      --red: #f7768e;\n      --purple: #bb9af7;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      padding: 22px;\n      background: var(--bg);\n      color: var(--text);\n      font-family:\n        Inter,\n        system-ui,\n        -apple-system,\n        BlinkMacSystemFont,\n        \"Segoe UI\",\n        sans-serif;\n    }\n\n    h1 {\n      margin: 0 0 4px 0;\n      font-size: 25px;\n    }\n\n    .subtitle {\n      color: var(--muted);\n\
        \      margin-bottom: 20px;\n      font-size: 13px;\n    }\n\n    .panel {\n      background: var(--panel);\n      border: 1px solid var(--border);\n      border-radius: 12px;\n      padding: 16px;\n      margin-bottom: 16px;\n    }\n\n    .preset-row {\n      display: flex;\n      gap: 8px;\n      flex-wrap: wrap;\n      margin-bottom: 16px;\n    }\n\n    button {\n      border: 1px solid var(--border);\n      background: var(--panel2);\n      color: var(--text);\n      padding: 9px 13px;\n      border-radius: 8px;\n      cursor: pointer;\n    }\n\n    button:hover {\n      border-color: var(--blue);\n    }\n\n    button.active {\n      background: var(--blue);\n      color: var(--bg);\n      border-color: var(--blue);\n      font-weight: 700;\n    }\n\n    .filters {\n      display: grid;\n      grid-template-columns:\n        repeat(auto-fit,minmax(170px,1fr));\n      gap: 12px;\n      align-items: end;\n    }\n\n    label {\n      display: block;\n      color: var(--muted);\n\
        \      font-size: 12px;\n      margin-bottom: 5px;\n    }\n\n    select,\n    input {\n      width: 100%;\n      border: 1px solid var(--border);\n      background: var(--panel2);\n      color: var(--text);\n      border-radius: 7px;\n      padding: 9px;\n    }\n\n    .run {\n      width: 100%;\n      background: var(--green);\n      color: var(--bg);\n      font-weight: 800;\n      border: none;\n    }\n\n    .lens {\n      margin-top: 14px;\n      padding: 10px 12px;\n      background: var(--panel2);\n      border-radius: 8px;\n      font-size: 13px;\n      color: var(--muted);\n    }\n\n    .status {\n      margin: 12px 0;\n      font-size: 13px;\n      color: var(--muted);\n    }\n\n    .table-wrap {\n      overflow-x: auto;\n      border-radius: 10px;\n      border: 1px solid var(--border);\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      min-width: 1500px;\n      background: var(--panel);\n    }\n\n    th {\n      text-align: left;\n      font-size:\
        \ 11px;\n      text-transform: uppercase;\n      letter-spacing: .04em;\n      color: var(--muted);\n      background: var(--panel2);\n      padding: 10px 8px;\n      position: sticky;\n      top: 0;\n    }\n\n    td {\n      padding: 10px 8px;\n      border-top: 1px solid var(--border);\n      font-size: 13px;\n      vertical-align: middle;\n    }\n\n    tr:hover td {\n      background: rgba(122,162,247,.06);\n    }\n\n    .ticker {\n      color: var(--cyan);\n      font-weight: 800;\n    }\n\n    .company {\n      max-width: 220px;\n    }\n\n    .muted {\n      color: var(--muted);\n    }\n\n    .score {\n      font-weight: 800;\n    }\n\n    .exceptional {\n      color: var(--green);\n    }\n\n    .strong {\n      color: var(--cyan);\n    }\n\n    .interesting {\n      color: var(--yellow);\n    }\n\n    .watch {\n      color: var(--orange);\n    }\n\n    .links a {\n      color: var(--blue);\n      margin-right: 8px;\n      text-decoration: none;\n    }\n\n    .why-btn {\n  \
        \    font-size: 11px;\n      padding: 6px 8px;\n    }\n\n    #detail {\n      display: none;\n    }\n\n    .detail-grid {\n      display: grid;\n      grid-template-columns:\n        repeat(auto-fit,minmax(170px,1fr));\n      gap: 10px;\n      margin: 12px 0;\n    }\n\n    .detail-card {\n      padding: 12px;\n      background: var(--panel2);\n      border-radius: 8px;\n      border: 1px solid var(--border);\n    }\n\n    .detail-value {\n      font-size: 22px;\n      font-weight: 800;\n      margin-top: 3px;\n    }\n\n    .good {\n      color: var(--green);\n    }\n\n    .warn {\n      color: var(--yellow);\n    }\n\n    .bad {\n      color: var(--red);\n    }\n\n    ul {\n      margin-top: 5px;\n    }\n\n    .footnote {\n      color: var(--muted);\n      font-size: 11px;\n      line-height: 1.5;\n      margin-top: 12px;\n    }\n\n    .loading {\n      animation: pulse 1.3s infinite;\n    }\n\n    @keyframes pulse {\n      0% { opacity: .45; }\n      50% { opacity: 1; }\n      100%\
        \ { opacity: .45; }\n    }\n\n    @media (max-width: 700px) {\n      body {\n        padding: 10px;\n      }\n    }\n  </style>\n</head>\n\n<body>\n\n  <h1>Global Opportunity Stock Screener</h1>\n\n  <div class=\"subtitle\">\n    Quality \xD7 Value \xD7 Growth \xB7 Global discovery \xB7 Market caps shown in GBP\n  </div>\n\n  <div class=\"panel\">\n\n    <div class=\"preset-row\">\n      <button\n        class=\"preset active\"\n        data-preset=\"opportunity\">\n        Opportunity\n      </button>\n\n      <button\n        class=\"preset\"\n        data-preset=\"deepvalue\">\n        Deep Value\n      </button>\n\n      <button\n        class=\"preset\"\n        data-preset=\"compounder\">\n        Quality Compounder\n      </button>\n\n      <button\n        class=\"preset\"\n        data-preset=\"growthvalue\">\n        Growth at Value\n      </button>\n\n      <button\n        class=\"preset\"\n        data-preset=\"smallcap\">\n        \U0001F41F Small Cap Opportunity\n\
        \      </button>\n\n      <button\n        class=\"preset\"\n        data-preset=\"tenbagger\">\n        \U0001F680 Tenbagger / Lynch\n      </button>\n    </div>\n\n    <div class=\"filters\">\n\n      <div>\n        <label>Region</label>\n\n        <select id=\"region\">\n          <option value=\"global\">\U0001F30D Global</option>\n          <option value=\"gb\">\U0001F1EC\U0001F1E7 United Kingdom</option>\n          <option value=\"us\">\U0001F1FA\U0001F1F8 United States</option>\n          <option value=\"ca\">\U0001F1E8\U0001F1E6 Canada</option>\n          <option value=\"europe\">\U0001F1EA\U0001F1FA Europe</option>\n          <option value=\"japan\">\U0001F1EF\U0001F1F5 Japan</option>\n          <option value=\"korea\">\U0001F1F0\U0001F1F7 South Korea</option>\n          <option value=\"australia\">\U0001F1E6\U0001F1FA Australia</option>\n          <option value=\"asia\">\U0001F30F Asia-Pacific</option>\n          <option value=\"emerging\">\U0001F331 Emerging Markets</option>\n\
        \        </select>\n      </div>\n\n      <div>\n        <label>Sector</label>\n\n        <select id=\"sector\">\n          <option value=\"\">All sectors</option>\n          <option>Basic Materials</option>\n          <option>Communication Services</option>\n          <option>Consumer Cyclical</option>\n          <option>Consumer Defensive</option>\n          <option>Energy</option>\n          <option>Financial Services</option>\n          <option>Healthcare</option>\n          <option>Industrials</option>\n          <option>Real Estate</option>\n          <option>Technology</option>\n          <option>Utilities</option>\n        </select>\n      </div>\n\n      <div>\n        <label>Minimum Market Cap (\xA3m)</label>\n        <input id=\"minCap\" type=\"number\" value=\"500\" min=\"0\">\n      </div>\n\n      <div>\n        <label>Maximum Market Cap (\xA3m)</label>\n        <input\n          id=\"maxCap\"\n          type=\"number\"\n          value=\"0\"\n          min=\"0\"\n\
        \          placeholder=\"0 = no maximum\">\n      </div>\n\n      <div>\n        <label>Minimum Overall Score</label>\n        <input\n          id=\"minScore\"\n          type=\"number\"\n          value=\"60\"\n          min=\"0\"\n          max=\"100\">\n      </div>\n\n      <div>\n        <button\n          class=\"run\"\n          onclick=\"runScreen()\">\n          Run Screen\n        </button>\n      </div>\n\n    </div>\n\n    <div class=\"lens\" id=\"lens\">\n      Opportunity \xB7 Quality 40% \xB7 Value 40% \xB7 Growth 20%\n    </div>\n\n  </div>\n\n  <div class=\"panel\" id=\"detail\">\n\n    <h2 id=\"detailTitle\"></h2>\n\n    <div\n      class=\"muted\"\n      id=\"detailSubtitle\">\n    </div>\n\n    <div class=\"detail-grid\">\n\n      <div class=\"detail-card\">\n        <div class=\"muted\">Overall</div>\n        <div\n          class=\"detail-value\"\n          id=\"dOverall\">\n        </div>\n      </div>\n\n      <div class=\"detail-card\">\n        <div class=\"\
        muted\">Quality</div>\n        <div\n          class=\"detail-value\"\n          id=\"dQuality\">\n        </div>\n      </div>\n\n      <div class=\"detail-card\">\n        <div class=\"muted\">Value</div>\n        <div\n          class=\"detail-value\"\n          id=\"dValue\">\n        </div>\n      </div>\n\n      <div class=\"detail-card\">\n        <div class=\"muted\">Growth</div>\n        <div\n          class=\"detail-value\"\n          id=\"dGrowth\">\n        </div>\n      </div>\n\n    </div>\n\n    <h3>Strengths</h3>\n    <ul id=\"strengths\"></ul>\n\n    <h3>Things to investigate</h3>\n    <ul id=\"cautions\"></ul>\n\n    <h3>Missing / incomplete data</h3>\n    <ul id=\"missing\"></ul>\n\n  </div>\n\n  <div class=\"status\" id=\"status\">\n    Ready.\n  </div>\n\n  <div class=\"table-wrap\">\n\n    <table>\n\n      <thead>\n        <tr>\n          <th>Ticker</th>\n          <th>Company</th>\n          <th>Country</th>\n          <th>Sector</th>\n          <th>Overall</th>\n\
        \          <th>Lynch Stage</th>\n          <th>Quality</th>\n          <th>Value</th>\n          <th>Growth</th>\n          <th>P/E</th>\n          <th>FCF Yield</th>\n          <th>ROIC</th>\n          <th>ROE</th>\n          <th>Rev CAGR</th>\n          <th>EPS CAGR</th>\n          <th>Data</th>\n          <th>Market Cap</th>\n          <th>Why?</th>\n          <th>Links</th>\n        </tr>\n      </thead>\n\n      <tbody id=\"results\"></tbody>\n\n    </table>\n\n  </div>\n\n  <div class=\"footnote\">\n    This is a candidate-discovery tool, not an investment recommendation.\n    Missing Yahoo data is not automatically scored as zero. Global searches\n    balance candidates across countries so the result set is not dominated\n    by the United States. Small-cap candidates require additional research\n    into liquidity, dilution, customer concentration and balance-sheet risk.\n  </div>\n\n  <script>\n    var currentPreset = \"opportunity\";\n    var currentResults = [];\n\n  \
        \  var presets = {\n      opportunity: {\n        name: \"Opportunity\",\n        q: 40,\n        v: 40,\n        g: 20,\n        minCap: 500,\n        maxCap: 0,\n        score: 60\n      },\n\n      deepvalue: {\n        name: \"Deep Value\",\n        q: 25,\n        v: 60,\n        g: 15,\n        minCap: 300,\n        maxCap: 0,\n        score: 58\n      },\n\n      compounder: {\n        name: \"Quality Compounder\",\n        q: 60,\n        v: 20,\n        g: 20,\n        minCap: 750,\n        maxCap: 0,\n        score: 65\n      },\n\n      growthvalue: {\n        name: \"Growth at Value\",\n        q: 35,\n        v: 25,\n        g: 40,\n        minCap: 500,\n        maxCap: 0,\n        score: 60\n      },\n\n      smallcap: {\n        name: \"Small Cap Opportunity\",\n        q: 45,\n        v: 35,\n        g: 20,\n        minCap: 100,\n        maxCap: 1500,\n        score: 55\n      },\n\n      tenbagger: {\n        name: \"Tenbagger / Lynch\",\n        q: 25,\n       \
        \ v: 20,\n        g: 55,\n        minCap: 150,\n        maxCap: 7500,\n        score: 45\n      }\n    };\n\n\n    document\n      .querySelectorAll(\".preset\")\n      .forEach(function(button) {\n\n        button.addEventListener(\n          \"click\",\n          function() {\n\n            document\n              .querySelectorAll(\".preset\")\n              .forEach(function(b) {\n                b.classList.remove(\n                  \"active\"\n                );\n              });\n\n            button.classList.add(\n              \"active\"\n            );\n\n            currentPreset =\n              button.dataset.preset;\n\n            var p =\n              presets[currentPreset];\n\n            document\n              .getElementById(\"minCap\")\n              .value = p.minCap;\n\n            document\n              .getElementById(\"maxCap\")\n              .value = p.maxCap;\n\n            document\n              .getElementById(\"minScore\")\n              .value\
        \ = p.score;\n\n            updateLens();\n          }\n        );\n      });\n\n\n    function updateLens() {\n      var p = presets[currentPreset];\n\n      document.getElementById(\n        \"lens\"\n      ).textContent = currentPreset === \"tenbagger\"\n        ? \"Tenbagger / Lynch \xB7 Growth + runway led \xB7 \xA3150m\u2013\xA37.5bn \xB7 PEG, ROIC, leverage and scaling economics\"\n        : p.name +\n          \" \xB7 Quality \" +\n          p.q +\n          \"% \xB7 Value \" +\n          p.v +\n          \"% \xB7 Growth \" +\n          p.g +\n          \"%\";\n    }\n\n\n    function fmt(value, digits) {\n      if (\n        value === null ||\n        value === undefined ||\n        isNaN(value)\n      ) {\n        return \"\u2014\";\n      }\n\n      return Number(value).toFixed(\n        digits === undefined ? 1 : digits\n      );\n    }\n\n\n    function pct(value) {\n      if (\n        value === null ||\n        value === undefined\n      ) {\n        return \"\u2014\
        \";\n      }\n\n      return (\n        Number(value * 100).toFixed(1)\n        + \"%\"\n      );\n    }\n\n\n    function scoreClass(score) {\n      if (score >= 85) {\n        return \"exceptional\";\n      }\n\n      if (score >= 75) {\n        return \"strong\";\n      }\n\n      if (score >= 65) {\n        return \"interesting\";\n      }\n\n      return \"watch\";\n    }\n\n\n    function scoreLabel(score) {\n      if (score >= 85) {\n        return \"Exceptional\";\n      }\n\n      if (score >= 75) {\n        return \"Strong\";\n      }\n\n      if (score >= 65) {\n        return \"Interesting\";\n      }\n\n      return \"Watchlist\";\n    }\n\n\n    function capFormat(value) {\n      if (\n        value === null ||\n        value === undefined\n      ) {\n        return \"\u2014\";\n      }\n\n      if (value >= 1000) {\n        return (\n          \"\xA3\" +\n          (value / 1000).toFixed(1)\n          + \"bn\"\n        );\n      }\n\n      return (\n        \"\xA3\"\
        \ +\n        value.toFixed(0)\n        + \"m\"\n      );\n    }\n\n\n    async function runScreen() {\n\n      var status =\n        document.getElementById(\n          \"status\"\n        );\n\n      status.textContent =\n        \"Screening markets and analysing candidates\u2026\";\n\n      status.classList.add(\n        \"loading\"\n      );\n\n      document.getElementById(\n        \"results\"\n      ).innerHTML = \"\";\n\n      document.getElementById(\n        \"detail\"\n      ).style.display = \"none\";\n\n      var params =\n        new URLSearchParams();\n\n      params.set(\n        \"region\",\n        document.getElementById(\n          \"region\"\n        ).value\n      );\n\n      params.set(\n        \"sector\",\n        document.getElementById(\n          \"sector\"\n        ).value\n      );\n\n      params.set(\n        \"preset\",\n        currentPreset\n      );\n\n      params.set(\n        \"min_cap\",\n        document.getElementById(\n          \"minCap\"\
        \n        ).value\n      );\n\n      params.set(\n        \"max_cap\",\n        document.getElementById(\n          \"maxCap\"\n        ).value\n      );\n\n      params.set(\n        \"min_score\",\n        document.getElementById(\n          \"minScore\"\n        ).value\n      );\n\n      try {\n\n        var response = await fetch(\n          \"/api/screen?\"\n          + params.toString()\n        );\n\n        var data =\n          await response.json();\n\n        currentResults =\n          data.results || [];\n\n        renderResults(\n          currentResults\n        );\n\n        status.classList.remove(\n          \"loading\"\n        );\n\n        status.textContent =\n          currentResults.length +\n          \" results \xB7 \"\n          + data.candidates_scanned\n          + \" candidates analysed \xB7 \"\n          + data.regions_scanned.length\n          + \" market(s) searched.\";\n\n      } catch (error) {\n\n        status.classList.remove(\n          \"\
        loading\"\n        );\n\n        status.textContent =\n          \"Screen failed: \"\n          + error.message;\n      }\n    }\n\n\n    function renderResults(results) {\n\n      var body =\n        document.getElementById(\n          \"results\"\n        );\n\n      body.innerHTML = \"\";\n\n      results.forEach(\n        function(stock, index) {\n\n          var row =\n            document.createElement(\n              \"tr\"\n            );\n\n          var cls =\n            scoreClass(\n              stock.overall\n            );\n\n          row.innerHTML =\n            \"<td class='ticker'>\"\n            + stock.symbol\n            + \"</td>\"\n\n            + \"<td class='company'>\"\n            + stock.company\n            + \"</td>\"\n\n            + \"<td>\"\n            + (stock.country || \"\u2014\")\n            + \"</td>\"\n\n            + \"<td>\"\n            + stock.sector\n            + \"</td>\"\n\n            + \"<td class='score \"\n            + cls\n\
        \            + \"'>\"\n            + fmt(stock.overall)\n            + \"<br><span class='muted'>\"\n            + scoreLabel(stock.overall)\n            + \"</span></td>\"\n\n            + \"<td>\"\n            + (currentPreset === \"tenbagger\" ? (stock.tenbagger_stage || \"Watch\") : \"\u2014\")\n            + \"</td>\"\n\n            + \"<td>\"\n            + fmt(stock.quality)\n            + \"</td>\"\n\n            + \"<td>\"\n            + fmt(stock.value)\n            + \"</td>\"\n\n            + \"<td>\"\n            + fmt(stock.growth)\n            + \"</td>\"\n\n            + \"<td>\"\n            + fmt(stock.pe)\n            + \"</td>\"\n\n            + \"<td>\"\n            + pct(stock.fcf_yield)\n            + \"</td>\"\n\n            + \"<td>\"\n            + pct(stock.roic)\n            + \"</td>\"\n\n            + \"<td>\"\n            + pct(stock.roe)\n            + \"</td>\"\n\n            + \"<td>\"\n            + pct(stock.revenue_cagr)\n            + \"</td>\"\
        \n\n            + \"<td>\"\n            + pct(stock.earnings_cagr)\n            + \"</td>\"\n\n            + \"<td>\"\n            + stock.data_completeness\n            + \"%</td>\"\n\n            + \"<td>\"\n            + capFormat(\n              stock.market_cap_gbp_m\n            )\n            + \"</td>\"\n\n            + \"<td>\"\n            + \"<button class='why-btn' \"\n            + \"onclick='showDetail(\"\n            + index\n            + \")'>Why?</button>\"\n            + \"</td>\"\n\n            + \"<td class='links'>\"\n            + \"<a target='_blank' href='\"\n            + stock.tradingview\n            + \"'>TV</a>\"\n            + \"<a target='_blank' href='\"\n            + stock.yahoo\n            + \"'>Yahoo</a>\"\n            + \"</td>\";\n\n          body.appendChild(row);\n        }\n      );\n    }\n\n\n    function listInto(id, items, fallback) {\n\n      var el =\n        document.getElementById(id);\n\n      el.innerHTML = \"\";\n\n      if (!items\
        \ || items.length === 0) {\n\n        var li =\n          document.createElement(\n            \"li\"\n          );\n\n        li.textContent = fallback;\n\n        el.appendChild(li);\n\n        return;\n      }\n\n      items.forEach(function(text) {\n\n        var li =\n          document.createElement(\n            \"li\"\n          );\n\n        li.textContent = text;\n\n        el.appendChild(li);\n      });\n    }\n\n\n    function showDetail(index) {\n\n      var stock =\n        currentResults[index];\n\n      if (!stock) {\n        return;\n      }\n\n      document.getElementById(\n        \"detail\"\n      ).style.display = \"block\";\n\n      document.getElementById(\n        \"detailTitle\"\n      ).textContent =\n        stock.symbol +\n        \" \u2014 \" +\n        stock.company;\n\n      document.getElementById(\n        \"detailSubtitle\"\n      ).textContent =\n        (stock.country || \"\") +\n        \" \xB7 \" +\n        stock.sector +\n        \" \xB7 \"\
        \ +\n        (stock.industry || \"\") +\n        \" \xB7 Data completeness \"\n        + stock.data_completeness\n        + \"%\";\n\n      document.getElementById(\n        \"dOverall\"\n      ).textContent =\n        fmt(stock.overall);\n\n      document.getElementById(\n        \"dQuality\"\n      ).textContent =\n        fmt(stock.quality);\n\n      document.getElementById(\n        \"dValue\"\n      ).textContent =\n        fmt(stock.value);\n\n      document.getElementById(\n        \"dGrowth\"\n      ).textContent =\n        fmt(stock.growth);\n\n      var detailStrengths = (stock.strengths || []).slice();\n      if (currentPreset === \"tenbagger\" && stock.tenbagger_notes) {\n        detailStrengths = stock.tenbagger_notes.concat(detailStrengths);\n      }\n\n      listInto(\n        \"strengths\",\n        detailStrengths,\n        \"No obvious standout strengths were generated automatically.\"\n      );\n\n      listInto(\n        \"cautions\",\n        stock.cautions,\n\
        \        \"No automatic cautions generated \u2014 still complete normal research.\"\n      );\n\n      listInto(\n        \"missing\",\n        stock.missing,\n        \"No major scoring fields appear to be missing.\"\n      );\n\n      window.scrollTo({\n        top:\n          document.getElementById(\n            \"detail\"\n          ).offsetTop - 10,\n        behavior: \"smooth\"\n      });\n    }\n\n\n    updateLens();\n  </script>\n\n</body>\n</html>\n"
    command:
    - /bin/sh
    - -c
    - "mkdir -p /app/static\n\nprintf '%s' \"$$APP_PY\" > /app/app.py\nprintf '%s' \"$$INDEX_HTML\" > /app/static/index.html\n\npip install --no-cache-dir \\\n  flask \\\n  yfinance \\\n  pandas\n\npython /app/app.py"
